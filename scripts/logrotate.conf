# 📝 TODO++ 日志轮转配置
# 自动管理和清理日志文件

# 全局配置
daily
rotate 30
compress
delaycompress
missingok
notifempty
create 644 root root

# Nginx 访问日志
/logs/nginx/access.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 nginx nginx
    postrotate
        docker exec todo-nginx-prod nginx -s reload 2>/dev/null || true
    endscript
}

# Nginx 错误日志
/logs/nginx/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 nginx nginx
    postrotate
        docker exec todo-nginx-prod nginx -s reload 2>/dev/null || true
    endscript
}

# 后端应用日志
/logs/backend/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
    copytruncate
}

# MongoDB 日志
/logs/mongo/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 mongodb mongodb
    postrotate
        docker exec todo-mongo-prod mongod --logRotate reopen 2>/dev/null || true
    endscript
}

# 健康检查日志
/logs/healthcheck/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
}

# Certbot 日志
/logs/certbot/*.log {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 644 root root
}
