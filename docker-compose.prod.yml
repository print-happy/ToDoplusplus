# 🚀 TODO++ 生产环境 Docker Compose 配置
# 优化的安全性、性能和可靠性配置

version: '3.8'

services:
  # MongoDB数据库
  mongo:
    image: mongo:7.0
    container_name: todo-mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-todoapp}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./logs/mongo:/var/log/mongodb
    networks:
      - todo-network
    command: mongod --auth --logpath /var/log/mongodb/mongod.log --logappend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # 后端API服务
  backend:
    image: ${DOCKER_USERNAME}/todo-plusplus-backend:${IMAGE_TAG:-latest}
    container_name: todo-backend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-todoapp}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - ./logs/backend:/app/logs
    networks:
      - todo-network
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx反向代理
  nginx:
    image: ${DOCKER_USERNAME}/todo-plusplus-nginx:${IMAGE_TAG:-latest}
    container_name: todo-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # 监控端口（仅内网）
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - todo-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-check.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: todo-certbot-prod
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - ./logs/certbot:/var/log/letsencrypt
    networks:
      - todo-network
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME}
    profiles:
      - ssl-init  # 仅在SSL初始化时运行

  # 日志管理和轮转
  logrotate:
    image: alpine:latest
    container_name: todo-logrotate-prod
    restart: unless-stopped
    volumes:
      - ./logs:/logs
      - ./scripts/logrotate.conf:/etc/logrotate.conf:ro
    networks:
      - todo-network
    command: >
      sh -c "
        apk add --no-cache logrotate &&
        while true; do
          logrotate -f /etc/logrotate.conf
          sleep 86400
        done
      "
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # 监控和健康检查
  healthcheck:
    image: alpine:latest
    container_name: todo-healthcheck-prod
    restart: unless-stopped
    volumes:
      - ./scripts/healthcheck.sh:/healthcheck.sh:ro
      - ./logs/healthcheck:/logs
    networks:
      - todo-network
    depends_on:
      - nginx
      - backend
      - mongo
    command: >
      sh -c "
        apk add --no-cache curl &&
        chmod +x /healthcheck.sh &&
        while true; do
          /healthcheck.sh
          sleep 60
        done
      "
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # 数据库备份服务
  backup:
    image: mongo:7.0
    container_name: todo-backup-prod
    restart: "no"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE:-todoapp}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - todo-network
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      sh -c "
        chmod +x /backup.sh &&
        /backup.sh
      "
    profiles:
      - backup  # 仅在备份时运行

# 网络配置
networks:
  todo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 数据卷配置
volumes:
  # 数据库数据持久化
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/mongo

  mongo_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/mongo-config

  # SSL证书
  certbot_www:
    driver: local

  certbot_conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/letsencrypt
